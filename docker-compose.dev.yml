name: yotsuba-dev

services:
  web:
    build: .
    container_name: yotsuba-dev-web
    ports:
      - "8084:80"
    environment:
      - YOTSUBA_DB_HOST=db
      - YOTSUBA_DB_PORT=3306
      - YOTSUBA_DB_USER=yotsuba
      - YOTSUBA_DB_PASS=yotsuba
      - YOTSUBA_DB_NAME=yotsuba_global
      - YOTSUBA_DB_DRIVER=pgsql
      - YOTSUBA_PG_HOST=pgdb
      - YOTSUBA_PG_PORT=5432
      - YOTSUBA_PG_USER=yotsuba
      - YOTSUBA_PG_PASS=yotsuba
      - YOTSUBA_PG_NAME=yotsuba_dev
      - YOTSUBA_MEMCACHED_HOST=memcached
      - YOTSUBA_MEMCACHED_PORT=11211
      - YOTSUBA_CLIP_HOST=clip
      - YOTSUBA_CLIP_PORT=8501
    depends_on:
      db:
        condition: service_healthy
      pgdb:
        condition: service_healthy
      memcached:
        condition: service_started
    stop_grace_period: 30s
    volumes:
      - uploads:/www/4chan.org/web/images
      - thumbs:/www/4chan.org/web/thumbs
      - dev_boards:/www/4chan.org/web/boards
      - dev_backups:/www/backups
      - dev_logs:/www/logs
    networks:
      - dev-net
    restart: unless-stopped

  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    container_name: yotsuba-dev-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: yotsuba
      MYSQL_PASSWORD: yotsuba
      MYSQL_DATABASE: yotsuba_global
    ports:
      - "3307:3306"
    volumes:
      - dev_db_data:/var/lib/mysql
      - dev_backups:/backups
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgdb:
    image: pgvector/pgvector:pg16
    container_name: yotsuba-dev-pgdb
    environment:
      POSTGRES_USER: yotsuba
      POSTGRES_PASSWORD: yotsuba
      POSTGRES_DB: yotsuba_dev
    ports:
      - "5433:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yotsuba -d yotsuba_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: yotsuba-dev-memcached
    ports:
      - "11212:11211"
    networks:
      - dev-net
    restart: unless-stopped

  clip:
    build:
      context: ./docker/clip
      dockerfile: Dockerfile
    container_name: yotsuba-dev-clip
    ports:
      - "8501:8501"
    volumes:
      - clip_cache:/home/clip/.cache
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped


volumes:
  dev_db_data:
  dev_pg_data:
  uploads:
    external: true
    name: yotsuba-board_uploads_data
  thumbs:
    external: true
    name: yotsuba-board_thumbs_data
  dev_boards:
  dev_backups:
  dev_logs:
  clip_cache:

networks:
  dev-net:
    driver: bridge
