services:
  web:
    build: .
    container_name: yotsuba-prod-web
    ports:
      - "8082:80"
    environment:
      - YOTSUBA_DB_DRIVER=pgsql
      - YOTSUBA_PG_HOST=pgdb
      - YOTSUBA_PG_PORT=5432
      - YOTSUBA_PG_USER=yotsuba
      - YOTSUBA_PG_PASS=yotsuba
      - YOTSUBA_PG_NAME=yotsuba
      - YOTSUBA_MEMCACHED_HOST=memcached
      - YOTSUBA_MEMCACHED_PORT=11211
      - YOTSUBA_CLIP_HOST=clip
      - YOTSUBA_CLIP_PORT=8501
    depends_on:
      pgdb:
        condition: service_healthy
      memcached:
        condition: service_started
    stop_grace_period: 30s
    volumes:
      - uploads_data:/www/4chan.org/web/images
      - thumbs_data:/www/4chan.org/web/thumbs
      - boards_data:/www/4chan.org/web/boards
      - backups_data:/www/backups
      - logs_data:/www/logs
    networks:
      - lab-net
    restart: unless-stopped

  pgdb:
    image: postgres:16-alpine
    container_name: yotsuba-prod-pgdb
    environment:
      POSTGRES_USER: yotsuba
      POSTGRES_PASSWORD: yotsuba
      POSTGRES_DB: yotsuba
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yotsuba -d yotsuba"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: yotsuba-prod-memcached
    ports:
      - "11211:11211"
    networks:
      - lab-net
    restart: unless-stopped

  clip:
    build:
      context: ./docker/clip
      dockerfile: Dockerfile
    container_name: yotsuba-prod-clip
    ports:
      - "8500:8501"
    volumes:
      - clip_cache:/home/clip/.cache
    networks:
      - lab-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped


volumes:
  pg_data:
    name: yotsuba-prod_pg_data
    external: true
  uploads_data:
    name: yotsuba-board_uploads_data
    external: true
  thumbs_data:
    name: yotsuba-board_thumbs_data
    external: true
  boards_data:
    name: yotsuba-board_boards_data
    external: true
  backups_data:
    name: yotsuba-board_backups_data
    external: true
  logs_data:
    name: yotsuba-board_logs_data
    external: true
  clip_cache:

networks:
  lab-net:
    driver: bridge
