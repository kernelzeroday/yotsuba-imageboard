services:
  web:
    build: .
    container_name: localchan-web
    ports:
      - "8082:80"
    environment:
      - LOCALCHAN_DB_HOST=db
      - LOCALCHAN_DB_PORT=3306
      - LOCALCHAN_DB_USER=localchan
      - LOCALCHAN_DB_PASS=localchan
      - LOCALCHAN_DB_NAME=localchan
      - LOCALCHAN_MEMCACHED_HOST=memcached
      - LOCALCHAN_MEMCACHED_PORT=11211
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    volumes:
      - uploads_data:/www/localchan/images
      - thumbs_data:/www/localchan/thumbs
      - boards_data:/www/localchan/boards
    networks:
      - lab-net
    restart: unless-stopped

  db:
    image: mariadb:10.1
    container_name: localchan-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: localchan
      MYSQL_PASSWORD: localchan
      MYSQL_DATABASE: localchan
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - lab-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: localchan-memcached
    ports:
      - "11211:11211"
    networks:
      - lab-net
    restart: unless-stopped

  adminer:
    image: adminer:4-standalone
    container_name: localchan-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - lab-net
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
  thumbs_data:
  boards_data:

networks:
  lab-net:
    driver: bridge
